[project]
name = "knowt"
version = "0.1.0"
description = "Compreensão de sistemas — chat-first, zero verdade silenciosa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "tzdata>=2024.1",
  "pymongo>=4.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
discovery = [
  "playwright>=1.40.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
