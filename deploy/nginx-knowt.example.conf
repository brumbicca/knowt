# Exemplo — NÃO activar até o DNS knowt apontar para esta VPS
# e o firewall Hostinger aceitar 80/443.
#
# Substitui SERVER_NAME e depois:
#   certbot --nginx -d SERVER_NAME
#   ln -sf /root/knowt/deploy/nginx-knowt.example.conf /etc/nginx/sites-enabled/knowt
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
