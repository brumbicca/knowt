# Fiesta BI — bi.fiestaup.toteus.cloud
# Proxy /api/bridge/ → Agent Gateway (127.0.0.1:8765)

server {
    server_name bi.fiestaup.toteus.cloud;

    root /var/www/fiesta-bi;
    index index.html;

    access_log /var/log/nginx/fiesta-bi-access.log;
    error_log /var/log/nginx/fiesta-bi-error.log;

    # Sessão partilhada com o Sistema 2 (cookie HttpOnly .fiestaup.toteus.cloud).
    auth_request /_bi_auth;
    error_page 401 = @bi_login;

    location = /_bi_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:8080/api/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host financial-api.fiestaup.toteus.cloud;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location @bi_login {
        auth_request off;
        return 302 https://fiestaup.toteus.cloud/login?next=https://bi.fiestaup.toteus.cloud$request_uri;
    }

    # Consulta + chat + OAuth Google callback.
    # O callback OAuth é validado por state e precisa ser público.
    location /api/bridge/agenda/google/callback {
        auth_request off;
        proxy_pass http://127.0.0.1:8765/agenda/google/callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bridge/ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat Rica IA / STT podem demorar
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bi.fiestaup.toteus.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bi.fiestaup.toteus.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = bi.fiestaup.toteus.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name bi.fiestaup.toteus.cloud;
    return 404; # managed by Certbot
}
